<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="cyberGrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.02" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#34d399;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#f43f5e;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#34d399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.45; }
    }
    @keyframes sweepLine {
      0% { transform: translateX(-400px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateX(1300px); opacity: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .orb-1 { transform-origin: 200px 180px; animation: pulseOrb 6s ease-in-out infinite; }
    .orb-2 { transform-origin: 1000px 180px; animation: pulseOrb 7s ease-in-out infinite 1s; }
    .sweep { animation: sweepLine 5s linear infinite; }
    .pill-group { animation: floatPill 4s ease-in-out infinite; }
    .radar { transform-origin: 1050px 80px; animation: radarScan 10s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Cyber Grid Pattern in Background -->
  <g stroke="#38bdf8" stroke-width="0.5" opacity="0.12">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="180" cy="180" r="140" fill="#0284c7" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="160" r="150" fill="#6366f1" filter="url(#glow)" />

  <!-- Animated Laser Sweep line across background -->
  <g class="sweep">
    <line x1="0" y1="180" x2="280" y2="180" stroke="#38bdf8" stroke-width="2" filter="url(#subtleGlow)" />
  </g>

  <!-- Decorative Radar Graphic (Corner Background) -->
  <g opacity="0.25">
    <circle cx="1050" cy="80" r="50" fill="none" stroke="#38bdf8" stroke-dasharray="3,3" />
    <circle cx="1050" cy="80" r="30" fill="none" stroke="#38bdf8" />
    <circle cx="1050" cy="80" r="10" fill="#38bdf8" />
    <line class="radar" x1="1050" y1="80" x2="1095" y2="80" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Foreground Shield / Decryption Icon -->
  <g transform="translate(60, 52)">
    <!-- Outer Shield Glow -->
    <path d="M 40 10 L 72 24 C 72 58 56 82 40 94 C 24 82 8 58 8 24 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#subtleGlow)" />
    <!-- Unlocked Shackle Graphic -->
    <path d="M 33 46 L 33 36 C 33 30 47 30 47 36 L 47 40" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <rect x="28" y="46" width="24" height="20" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <circle cx="40" cy="54" r="2.5" fill="#34d399" />
    <line x1="40" y1="56" x2="40" y2="61" stroke="#34d399" stroke-width="2" />
  </g>

  <!-- Foreground Titles & Content -->
  <g>
    <!-- Tagline Badge -->
    <rect x="160" y="52" width="280" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <circle cx="174" cy="65" r="4" fill="#34d399">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="186" y="69" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CURATED INTELLIGENCE &amp; RECOVERY</text>

    <!-- Main Title (Stays crisply in foreground) -->
    <text x="60" y="145" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">Ransomware Intelligence &amp; Decryption Analysis</text>

    <!-- Subtitle -->
    <text x="60" y="185" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">Enterprise SaaS Solutions, Cryptographic Decryptors, Dark Web Trackers &amp; Analysis Tooling</text>

    <!-- Feature Pills / Highlights -->
    <g class="pill-group" transform="translate(60, 230)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="180" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
        <text x="16" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">🔍 CTI &amp; Dark Web</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(196, 0)">
        <rect x="0" y="0" width="190" height="42" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.85" />
        <text x="16" y="26" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">🔓 Free Decryptors</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(402, 0)">
        <rect x="0" y="0" width="220" height="42" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" opacity="0.85" />
        <text x="16" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">⚡ Live Memory Rescue</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(638, 0)">
        <rect x="0" y="0" width="200" height="42" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1" opacity="0.85" />
        <text x="16" y="26" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">🛡️ Incident Response</text>
      </g>
    </g>

    <!-- Bottom Accent Border -->
    <line x1="60" y1="315" x2="1140" y2="315" stroke="#334155" stroke-width="1" />
    <text x="60" y="338" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">Verified Pricing • Company Sizing • GitHub Star Counts • Active RaaS Gang Tracking</text>
  </g>
</svg>